name: Dart checks

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: dart pub get

      - name: Format Dart code
        run: dart format .

      - name: Analyze source code
        run: dart analyze

      - name: Run unit tests
        run: dart test
